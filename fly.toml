# fly.toml — Stock Data Pipeline (data service: read-only API + nightly cron)
# The single data source. Consumer apps (Stock-App, Trader-Screener) read this API.

app = 'stock-data-pipeline-pat'
primary_region = 'ewr'

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"            # volume: JSON outputs + SQLite DBs
  DB_PATH = "/data/stocks.db"
  POL_DB_PATH = "/data/politicians.db"
  RUN_SCHEDULER = "1"           # in-process nightly cron (02:00 UTC) runs the FULL
                                # sequence: run.py --skip-validate, pol_refresh.py,
                                # then validate.py --strict (scheduler.run_all, #48).
  # BOOTSTRAP_ON_EMPTY = "0"    # set to disable the cold-volume bootstrap (#49)

[http_service]
  internal_port = 8080
  force_https = true
  # Must stay up so the in-process scheduler can fire the nightly pipeline.
  # (Fly volumes attach to one machine, so API + cron share this single machine.)
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"            # api.py health endpoint
    timeout = "10s"

# Shared volume — the nightly pipeline writes here, the API reads here.
[[mounts]]
  source = "pipeline_data"
  destination = "/data"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
